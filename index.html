<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Julia-Martins-LinkTree</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/7c8801c017.js" crossorigin="anonymous"></script>
</head>

<body>
  <main class="container">

    <img
      src="foto_julia.jpeg"
      alt="Júlia Martins"
      class="avatar"
    >
    <div class="nome">
      <h1>Júlia Martins</h1>
    </div>    

    <p class="bio">
      Desenvolvedora Front-end • Cloud • AWS
    </p>

    <div class="theme-switch">
      <i class="fa-solid fa-sun"></i>

      <label class="switch">
        <input type="checkbox" id="toggleTheme">
        <span class="slider"></span>
      </label>

      <i class="fa-solid fa-moon"></i>
    </div>

    <h2>Meus Links</h2>

    <div class="links">
      <a href="https://github.com/Julia-MartinsMarques" target="_blank">
        GitHub
      </a>

      <a href="https://www.linkedin.com/in/julia-martins-marques/" target="_blank">
        LinkedIn
      </a>

      <a href="https://www.instagram.com/dev_juh?utm_source=qr" target="_blank">
        Instagram
      </a>

     
    </div>

    <div class="socials">
      <a href="#"><i class="fa-brands fa-github"></i></a>
      <a href="#"><i class="fa-brands fa-linkedin"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
    </div>

    <footer>
      Feito por Júlia Martins ✨
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
